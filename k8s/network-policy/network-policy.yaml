# =====================================================================
# Replenix Kubernetes NetworkPolicy
#
# What this does: Creates a firewall INSIDE the cluster.
# Even if one pod is compromised, it can't talk to pods it shouldn't.
#
# Rules:
#   frontend      → can only call backend
#   backend       → can call rabbitmq + postgres (external)
#   rl-worker     → can only call rabbitmq + postgres (external)
#   rabbitmq      → only backend + rl-worker can connect to it
#   NO direct access to rabbitmq management UI from outside
# =====================================================================

# --- Default deny all ingress + egress in replenix-prod ---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
spec:
  podSelector: {}    # Applies to ALL pods in namespace
  policyTypes:
    - Ingress
    - Egress

---
# --- Allow ingress controller to reach frontend ---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-frontend
spec:
  podSelector:
    matchLabels:
      app: replenix-frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector:
            matchLabels:
              app: replenix-rl-worker
      ports:
        - protocol: TCP
          port: 3000

---
# --- Allow ingress controller to reach backend ---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-backend
spec:
  podSelector:
    matchLabels:
      app: replenix-backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector:
            matchLabels:
              app: replenix-frontend   # Frontend can also call backend internally
        - podSelector:
            matchLabels:
              app: replenix-observability  # Observability proxies /api_rl/* to backend
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: replenix-prod
          podSelector:
            matchLabels:
              app: replenix-observability  # Allow cross-namespace from prod observability
      ports:
        - protocol: TCP
          port: 8000

---
# --- Allow ingress controller to reach cert-manager solver pods ---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-cert-manager-solver
spec:
  podSelector:
    matchLabels:
      acme.cert-manager.io/http01-solver: "true"
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8089

---
# --- Allow frontend egress to PostgreSQL and DNS ---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-egress
spec:
  podSelector:
    matchLabels:
      app: replenix-frontend
  policyTypes:
    - Egress
  egress:
    # To backend
    - to:
        - podSelector:
            matchLabels:
              app: replenix-backend
      ports:
        - protocol: TCP
          port: 8000
    # To PostgreSQL
    - to:
        - podSelector:
            matchLabels:
              app: replenix-postgres
      ports:
        - protocol: TCP
          port: 5432
    # To RabbitMQ (for webhooks)
    - to:
        - podSelector:
            matchLabels:
              app: replenix-rabbitmq
      ports:
        - protocol: TCP
          port: 5672
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # HTTPS for external APIs (Resend emails)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443

---
# --- Allow backend egress to RabbitMQ and PostgreSQL ---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-egress
spec:
  podSelector:
    matchLabels:
      app: replenix-backend
  policyTypes:
    - Egress
  egress:
    # To RabbitMQ in same namespace
    - to:
        - podSelector:
            matchLabels:
              app: replenix-rabbitmq
      ports:
        - protocol: TCP
          port: 5672
    # To PostgreSQL (internal)
    - to:
        - podSelector:
            matchLabels:
              app: replenix-postgres
      ports:
        - protocol: TCP
          port: 5432
    # DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # HTTPS for external APIs (Groq, Resend)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443

---
# --- Allow RL workers to reach RabbitMQ and PostgreSQL ---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rl-worker-egress
spec:
  podSelector:
    matchLabels:
      app: replenix-rl-worker
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: replenix-rabbitmq
      ports:
        - protocol: TCP
          port: 5672
    - to:
        - podSelector:
            matchLabels:
              app: replenix-postgres
      ports:
        - protocol: TCP
          port: 5432
    # Webhook to Frontend
    - to:
        - podSelector:
            matchLabels:
              app: replenix-frontend
      ports:
        - protocol: TCP
          port: 3000
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
# --- RabbitMQ: only allow connections from backend + workers + KEDA ---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rabbitmq-ingress
spec:
  podSelector:
    matchLabels:
      app: replenix-rabbitmq
  policyTypes:
    - Ingress
  ingress:
    # Internal app pods (backend, rl-worker, frontend)
    - from:
        - podSelector:
            matchLabels:
              app: replenix-backend
        - podSelector:
            matchLabels:
              app: replenix-rl-worker
        - podSelector:
            matchLabels:
              app: replenix-frontend
      ports:
        - protocol: TCP
          port: 5672   # AMQP only — management UI (15672) not exposed
    # KEDA operator (runs in 'keda' namespace) needs port 5672 to poll
    # queue depth for rl-worker autoscaling. Without this rule, the
    # default-deny-all policy blocks KEDA → rabbitmq connections, causing
    # ScaledObject failure and rl-worker scaling to 0.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: keda
      ports:
        - protocol: TCP
          port: 5672

---
# --- PostgreSQL: only allow connections from backend + workers ---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress
spec:
  podSelector:
    matchLabels:
      app: replenix-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: replenix-frontend
        - podSelector:
            matchLabels:
              app: replenix-backend
        - podSelector:
            matchLabels:
              app: replenix-rl-worker
        - podSelector:
            matchLabels:
              app: replenix-observability   # Observability dashboard reads training data directly
      ports:
        - protocol: TCP
          port: 5432

---
# --- Allow ingress controller to reach observability dashboard ---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-observability
spec:
  podSelector:
    matchLabels:
      app: replenix-observability
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3001

---
# --- Allow observability egress to PostgreSQL, RabbitMQ, DNS, and external HTTPS ---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: observability-egress
spec:
  podSelector:
    matchLabels:
      app: replenix-observability
  policyTypes:
    - Egress
  egress:
    # To PostgreSQL (observability reads training data directly)
    - to:
        - podSelector:
            matchLabels:
              app: replenix-postgres
      ports:
        - protocol: TCP
          port: 5432
    # To RabbitMQ (for real-time training progress notifications)
    - to:
        - podSelector:
            matchLabels:
              app: replenix-rabbitmq
      ports:
        - protocol: TCP
          port: 5672
    # To Backend-RL (prod) — observability proxies /api_rl/* to backend:8000
    - to:
        - podSelector:
            matchLabels:
              app: replenix-backend
      ports:
        - protocol: TCP
          port: 8000
    # To Backend-RL (preprod) — cross-namespace proxy for /api_rl_preprod/*
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: replenix-preprod
          podSelector:
            matchLabels:
              app: replenix-backend
      ports:
        - protocol: TCP
          port: 8000
    # DNS — uses CoreDNS in kube-system
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # HTTPS for external APIs and AI services
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
    # To Kubernetes API Server
    # Note: Allowed unrestricted due to CNI handling of external API server IPs
    - ports:
        - protocol: TCP
          port: 443
    # To Alertmanager
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9093
