# =====================================================================
# Replenix RL Worker — Deployment + HorizontalPodAutoscaler
#
# The RL worker is CPU-heavy (PyTorch DQN training).
# We scale it based on RabbitMQ queue depth using KEDA (Kubernetes
# Event-Driven Autoscaling) — free, open-source.
#
# Scale logic: 1 worker per 2 jobs in the queue, min=1, max=4
# On a 2-node cluster (4 CPUs each = 8 total), 4 workers @ 1.5 CPU each
# = 6 CPUs used, leaving 2 CPUs for backend/frontend/rabbitmq.
# =====================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: rl-worker
  labels:
    app: replenix-rl-worker
    environment: prod
spec:
  replicas: 1   # KEDA ScaledObject will override this dynamically
  progressDeadlineSeconds: 900   # PyTorch cold-start can exceed the 600s default
  selector:
    matchLabels:
      app: replenix-rl-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: replenix-rl-worker
        environment: prod
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
        prometheus.io/path: "/metrics"
    spec:
      # Prefer rl-worker to be on the same node as backend (for shared RWO volume),
      # but do NOT require it — a hard requirement causes a deadlock when backend
      # restarts (Recreate strategy kills old pod first, leaving no affinity target).
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - replenix-backend
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      containers:
        - name: rl-worker
          image: DOCKER_USERNAME/replenix-rl-worker:IMAGE_TAG
          imagePullPolicy: Always

          # RL training is CPU-intensive — give it room to breathe
          resources:
            requests:
              cpu: "50m"    # Lowered to fit on DO nodes
              memory: "64Mi"
            limits:
              cpu: "1000m"    # Up to 1 CPU
              memory: "512Mi"

          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: STORAGE_DIR
              value: "/app/storage"
            # Limit PyTorch thread contention between workers
            - name: OMP_NUM_THREADS
              value: "2"
            - name: MKL_NUM_THREADS
              value: "2"
            - name: TORCH_NUM_THREADS
              value: "2"
            - name: MAX_PARALLEL_SKUS
              value: "4"
          envFrom:
            - secretRef:
                name: replenix-secrets

          volumeMounts:
            - name: rl-worker-storage
              mountPath: /app/storage

          securityContext:
            allowPrivilegeEscalation: false

      # rl-worker gets its own emptyDir — it must NOT share backend-storage-pvc.
      # DigitalOcean Block Storage (RWO) only allows one pod to mount a volume
      # at a time; sharing with the backend pod causes a permanent Multi-Attach
      # error. emptyDir is sufficient: models are referenced by DB path and
      # training works with synthetic/seasonal data without shared uploads.
      # TODO: migrate to object storage (DO Spaces) for proper cross-pod sharing.
      volumes:
        - name: rl-worker-storage
          emptyDir: {}

---
# =====================================================================
# KEDA ScaledObject — Auto-scale workers based on RabbitMQ queue depth
#
# Install KEDA first:
#   helm repo add kedacore https://kedacore.github.io/charts
#   helm install keda kedacore/keda --namespace keda --create-namespace
# =====================================================================
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: rl-worker-scaler
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rl-worker
  minReplicaCount: 1    # Always keep 1 worker warm
  maxReplicaCount: 4    # Max 4 workers on 2-node cluster
  cooldownPeriod: 300   # Wait 5 min before scaling down (jobs take time)
  pollingInterval: 30   # Check queue every 30 seconds
  triggers:
    - type: rabbitmq
      metadata:
        # NOTE: Do NOT set 'host' here — shell variable interpolation is NOT
        # supported in KEDA metadata fields. Auth is handled entirely by
        # TriggerAuthentication below (which reads RABBITMQ_URL from the secret).
        queueName: rl_training_jobs
        mode: QueueLength
        value: "2"   # 1 new worker per 2 jobs waiting in queue
      authenticationRef:
        name: rabbitmq-trigger-auth

---
# KEDA authentication using our existing secret
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: rabbitmq-trigger-auth
spec:
  secretTargetRef:
    - parameter: host
      name: replenix-secrets
      key: RABBITMQ_URL
