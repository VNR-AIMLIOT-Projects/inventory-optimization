apiVersion: apps/v1
kind: Deployment
metadata:
  name: observability
spec:
  replicas: 1
  progressDeadlineSeconds: 900
  selector:
    matchLabels:
      app: replenix-observability
  template:
    metadata:
      labels:
        app: replenix-observability
    spec:
      # Explicit DNS config to bypass intermittent EAI_AGAIN failures in DOKS.
      # Uses CoreDNS ClusterIP directly with full search path.
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 10.122.32.10
        searches:
          - replenix-preprod.svc.cluster.local
          - svc.cluster.local
          - cluster.local
        options:
          - name: ndots
            value: "5"
      containers:
        - name: observability
          image: DOCKER_USERNAME/replenix-observability:IMAGE_TAG
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: NODE_ENV
              value: "production"
          envFrom:
            - secretRef:
                name: replenix-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          readinessProbe:
            timeoutSeconds: 5
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            timeoutSeconds: 5
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 5
