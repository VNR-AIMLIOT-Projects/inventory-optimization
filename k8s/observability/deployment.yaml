apiVersion: apps/v1
kind: Deployment
metadata:
  name: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: replenix-observability
  template:
    metadata:
      labels:
        app: replenix-observability
    spec:
      containers:
        - name: observability
          image: DOCKER_USERNAME/replenix-observability:IMAGE_TAG
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: NODE_ENV
              value: "production"
          envFrom:
            - secretRef:
                name: replenix-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
