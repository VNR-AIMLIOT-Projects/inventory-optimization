apiVersion: v1
kind: ServiceAccount
metadata:
  name: observability-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: observability-k8s-role
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: observability-k8s-binding-prod
subjects:
  - kind: ServiceAccount
    name: observability-sa
    namespace: replenix-prod
roleRef:
  kind: ClusterRole
  name: observability-k8s-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: observability-k8s-binding-preprod
subjects:
  - kind: ServiceAccount
    name: observability-sa
    namespace: replenix-preprod
roleRef:
  kind: ClusterRole
  name: observability-k8s-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: observability
spec:
  replicas: 1
  progressDeadlineSeconds: 900
  selector:
    matchLabels:
      app: replenix-observability
  template:
    metadata:
      labels:
        app: replenix-observability
    spec:
      serviceAccountName: observability-sa
      # Explicit DNS config to bypass intermittent EAI_AGAIN failures in DOKS.
      # Uses CoreDNS ClusterIP directly. ndots:4 ensures 4-dot FQDNs like
      # postgres.replenix-prod.svc.cluster.local are tried absolute-first,
      # avoiding costly search-domain cascade before the correct answer.
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 10.122.32.10
        searches:
          - svc.cluster.local
          - cluster.local
        options:
          - name: ndots
            value: "4"
      containers:
        - name: observability
          image: DOCKER_USERNAME/replenix-observability:IMAGE_TAG
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: NODE_ENV
              value: "production"
            - name: ADMIN_USER
              value: "admin"
            - name: ADMIN_PASS
              valueFrom:
                secretKeyRef:
                  name: replenix-secrets
                  key: ADMIN_PASS
                  optional: true
          envFrom:
            - secretRef:
                name: replenix-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "300m"
              memory: "512Mi"
          readinessProbe:
            timeoutSeconds: 5
            httpGet:
              path: /healthz
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            timeoutSeconds: 5
            httpGet:
              path: /healthz
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 5
